apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: fin-recon-{{ ds_nodash }}-{{ (ti.run_id | replace("manual__", "") | replace("scheduled__", "") | replace(":", "-") | replace("+", "-") | replace("T", "-") | replace(".", "-") | replace(" ", "-"))[-25:] }}
  namespace: team-finance
  labels:
    app: finance-monthly-reconcile
    team: finance
    pipeline: reconcile
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: ghcr.io/kaitokid-123/finance-app/etl:880dc1fb091df4c00dcd4ad5e28b513a32ee4369
  imagePullPolicy: Always
  mainApplicationFile: local:///app/src/jobs/monthly_reconcile.py
  arguments:
    - "--year"
    - "{{ logical_date.year }}"
    - "--month"
    - "{{ (logical_date.replace(day=1) - macros.timedelta(days=1)).month }}"
  sparkVersion: "3.5.0"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 1
    onFailureRetryInterval: 120
  sparkConf:
    # S3 / MinIO
    spark.hadoop.fs.s3a.endpoint: "http://minio.platform-storage:9000"
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
    # AWS SDK region (required by Iceberg S3FileIO)
    spark.emr-serverless.override.region: "us-east-1"
    # Iceberg REST Catalog
    spark.sql.extensions: "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
    spark.sql.catalog.iceberg: "org.apache.iceberg.spark.SparkCatalog"
    spark.sql.catalog.iceberg.type: "rest"
    spark.sql.catalog.iceberg.uri: "http://iceberg-rest.platform-storage:8181"
    spark.sql.catalog.iceberg.io-impl: "org.apache.iceberg.aws.s3.S3FileIO"
    spark.sql.catalog.iceberg.s3.endpoint: "http://minio.platform-storage:9000"
    spark.sql.catalog.iceberg.s3.region: "us-east-1"
    spark.sql.catalog.iceberg.s3.path-style-access: "true"
    # Performance
    spark.sql.adaptive.enabled: "true"
  driver:
    cores: 1
    coreLimit: "1000m"
    memory: "1g"
    memoryOverhead: "512m"
    serviceAccount: spark-team-finance
    envSecretKeyRefs:
      AWS_ACCESS_KEY_ID:
        name: team-finance-s3-creds
        key: access_key
      AWS_SECRET_ACCESS_KEY:
        name: team-finance-s3-creds
        key: secret_key
    env:
      - name: AWS_REGION
        value: "us-east-1"
  executor:
    cores: 1
    coreLimit: "1000m"
    instances: 2
    memory: "1g"
    memoryOverhead: "512m"
    envSecretKeyRefs:
      AWS_ACCESS_KEY_ID:
        name: team-finance-s3-creds
        key: access_key
      AWS_SECRET_ACCESS_KEY:
        name: team-finance-s3-creds
        key: secret_key
    env:
      - name: AWS_REGION
        value: "us-east-1"
